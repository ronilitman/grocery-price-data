name: Tests

# Fast and dependency-free on purpose: the tests read carved XML fixtures and
# build SQLite databases in memory, so nothing here scrapes a chain or needs
# the exit node. That is what lets them run on every push rather than only in
# the nightly build, which is where the promotion bugs kept being discovered.

on:
  push:
  pull_request:
  workflow_dispatch:
  # Called by build.yml as a gate. Defined once and reused rather than copied,
  # so the tests that guard a build can never drift from the ones run on push.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deliberately not requirements.txt: that installs both scraper packages
      # from git and takes minutes. The tests import scripts/ directly and need
      # nothing but the standard library - except requests, which scripts/
      # netiv.py imports at module scope and which installs in a second.
      - name: Install pytest
        run: pip install pytest requests

      - name: Run the tests
        run: python -m pytest tests/ -v
