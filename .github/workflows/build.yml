name: Build price database

on:
  schedule:
    - cron: '0 2 * * *'      # 02:00 UTC - after the chains publish their nightly full files
  workflow_dispatch:
    inputs:
      chains:
        description: 'Space-separated chain names, or blank for the default list'
        required: false
        default: ''
      limit:
        description: 'Max files per chain (leave blank for all; use e.g. 20 for a smoke test)'
        required: false
        default: ''
      reuse_run_id:
        description: 'Run ID to reuse chain databases from, skipping scraping entirely (publish-only rebuild, e.g. after a client-only change)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  # read: to download artifacts from a previous run (reuse_run_id).
  # write: to delete a previous attempt's Pages artifact - see "Clear the
  # Pages artifact" below.
  actions: write

concurrency:
  group: build-price-db
  cancel-in-progress: false

jobs:
  # The gate. Half a minute against a 45 minute scrape, and it fails before a
  # single chain is touched rather than after everything has been published:
  # three promotion bugs in a week reached the app, and each was found by a
  # shopper in an aisle rather than by us.
  tests:
    uses: ./.github/workflows/tests.yml

  fetch:
    name: ${{ matrix.chain }}
    needs: tests
    if: ${{ github.event.inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false          # one broken chain must not sink the other 16
      max-parallel: 6
      matrix:
        chain:
          - RAMI_LEVY
          - SHUFERSAL
          - VICTORY_NEW_SOURCE
          - YOHANANOF
          - OSHER_AD
          - HAZI_HINAM
          - TIV_TAAM
          - YAYNO_BITAN_AND_CARREFOUR
          - MAHSANI_ASHUK_NEW_SOURCE
          - KING_STORE
          - STOP_MARKET
          - ZOL_VEBEGADOL
          - KESHET
          - DOR_ALON
          - FRESH_MARKET_AND_SUPER_DOSH
          - SUPER_PHARM
          - YELLOW
          # Scraped by scripts/netiv.py rather than by the library. The
          # library's NETIV_HASED points at a host that has answered 500 for
          # months, so it disables the chain and drops it from
          # ScraperFactory.all_scrapers_name() - but the chain only moved, and
          # publishes three separately-priced brands (נתיב החסד, בר-כל,
          # שירה מרקט) at app.netiv-hesed.com. The Cloudflare in front of it
          # rejects bot User-Agents, not datacenter addresses, which is why it
          # is not in HOME_EGRESS.
          - NETIV_HASED
          # The library ships 31 scrapers and we ran 17 of them. These are the
          # rest. A
          # runner's own connection is tried first, and only a chain that
          # actually refuses it earns a place in HOME_EGRESS - which is how
          # HET_COHEN_NEW_SOURCE, listed here, ended up routed after all.
          - BAREKET
          - CITY_MARKET_SHOPS
          - GOOD_PHARM
          - HET_COHEN_NEW_SOURCE
          - MAAYAN_2000
          - MESHMAT_YOSEF_1
          - MESHMAT_YOSEF_2
          - POLIZER
          - SALACH_DABACH
          - SHEFA_BARCART_ASHEM
          - SHUK_AHIR
          - SUPER_SAPIR
          - SUPER_YUDA
          - WOLT
    env:
      # These refuse datacenter addresses outright - Reblaze answers 247,
      # Cloudflare answers 403, and laibcatalog just never answers. Nothing
      # about the request is wrong; a runner is simply not allowed to ask.
      # Their traffic leaves through a machine at home instead. OSHER_AD is in
      # on suspicion: it downloads price files locally and only store files on
      # a runner, which is the same shape. HET_COHEN_NEW_SOURCE is a laibcatalog
      # chain too, and had been left on runner egress by oversight: it timed out
      # after 30s on getbranches every night while answering in 56ms from home.
      HOME_EGRESS: '["SUPER_PHARM","HAZI_HINAM","VICTORY_NEW_SOURCE","MAHSANI_ASHUK_NEW_SOURCE","OSHER_AD","HET_COHEN_NEW_SOURCE"]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scraper and parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      # Placed after pip on purpose: package downloads should not travel
      # through a home connection, only the chain's own files.
      - name: Join the tailnet
        if: contains(fromJSON(env.HOME_EGRESS), matrix.chain)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Leave from home
        if: contains(fromJSON(env.HOME_EGRESS), matrix.chain)
        # TS_EXIT_NODE is a repository *variable*, not a secret - point it at
        # whichever machine is currently acting as the exit node and nothing
        # here needs editing.
        run: |
          sudo tailscale set --exit-node='${{ vars.TS_EXIT_NODE }}'
          echo "egress now: $(curl -s --max-time 20 https://ipinfo.io/org)"

      # Three attempts, because most of what goes wrong here is weather
      # rather than illness: a chain rate-limits the exit node for a minute, a
      # TLS handshake dies, laibcatalog stops answering and starts again. A
      # single attempt turned those into a whole chain missing for a day, and
      # the publish job carries the previous data forward so silently that
      # nobody notices until a price is wrong in a shop.
      #
      # The dumps directory is cleared between attempts. fetch.py fails when it
      # finds no XML at all, so a half-finished download left behind by attempt
      # one could let attempt two "succeed" on a fraction of the chain, which
      # is worse than the failure it replaced.
      #
      # This cannot help a runner that GitHub reclaims mid-job - exit 143 takes
      # the retry loop with it. That case is handled by .github/workflows/
      # retry-failed-chains.yml, which re-runs the job on a fresh runner.
      - name: Scrape and parse
        run: |
          for attempt in 1 2 3; do
            echo "::group::${{ matrix.chain }} attempt $attempt of 3"
            rm -rf dumps outputs
            if python scripts/fetch.py "${{ matrix.chain }}" \
                 --timeout 2400 \
                 ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}
            then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::${{ matrix.chain }} attempt $attempt failed"
            # An `[ ] && sleep` one-liner would be false on the last pass,
            # and under `set -e` that aborts the step before the error
            # annotation below ever prints.
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 60)); fi
          done
          echo "::error::${{ matrix.chain }} failed three times"
          exit 1

      # Back to the runner's own connection before the artifact upload, so a
      # home line carries the chain's files and nothing else. always(), because
      # a failed scrape should not leave the route pinned either.
      - name: Stop leaving from home
        if: always() && contains(fromJSON(env.HOME_EGRESS), matrix.chain)
        run: sudo tailscale set --exit-node=

      - name: Build chain database
        run: python scripts/build_chain_db.py --chain "${{ matrix.chain }}"

      - uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.chain }}
          # 7 days, not 1: reuse_run_id republishes from a prior run's
          # artifacts, and a one-day window makes that unusable by Tuesday.
          path: chain_dbs/*.db
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [tests, fetch]
    # always(), because publishing whatever chains succeeded is the whole point
    # of carrying a failed one forward - but never over a failed test. Without
    # the second clause always() would publish through a red suite, which is
    # the one thing this gate exists to prevent. A reuse_run_id rebuild skips
    # fetch entirely, so 'skipped' has to count as acceptable there.
    if: always() && needs.tests.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          pattern: db-*
          merge-multiple: true
          path: chain_dbs
          # Defaults to this run's own artifacts; reuse_run_id points it at an
          # older run's instead, so a client-only change can redeploy without
          # rescraping every chain.
          run-id: ${{ github.event.inputs.reuse_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what arrived
        run: ls -lh chain_dbs/

      # A chain that failed tonight still has yesterday's artifact. Rebuilding
      # without it would delete that chain from the site - which is what a
      # sleeping exit node did on 26 Aug, taking five chains down with it.
      - name: Carry forward any chain that failed tonight
        run: python scripts/backfill_chains.py --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge, shard, verify
        run: |
          python scripts/merge_db.py --in-dir chain_dbs --out dist/prices.db
          python scripts/build_catalog.py --db dist/prices.db --out-dir dist/catalog
          python scripts/verify.py --db dist/prices.db

      - name: Assemble the site
        run: |
          # The page reads the JSON shards directly - no SQLite, no WASM, and
          # no 407 MB download. prices.db stays on the Release for anyone who
          # wants to run arbitrary SQL against it.
          cp client/index.html dist/index.html
          # prices.db is built and verified but no longer published: it has
          # outgrown GitHub's 2 GB release-asset limit, and the site reads the
          # JSON shards regardless. Nothing consumed the release copy.
          rm -f dist/prices.db
          du -sh dist dist/catalog
          ls -1 dist

      - uses: actions/configure-pages@v5
      # A re-run does not replace the first attempt's Pages artifact, it adds
      # to it, and deploy-pages refuses outright when it finds two of them:
      # "Multiple artifacts named github-pages were unexpectedly found". That
      # is how run #47 scraped all 31 chains successfully on its second attempt
      # and then published nothing at all. Since retry-failed-chains.yml exists
      # precisely to cause second attempts, publish has to be repeatable.
      - name: Clear the Pages artifact left by an earlier attempt
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                  --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for id in $ids; do
            echo "removing stale github-pages artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4

