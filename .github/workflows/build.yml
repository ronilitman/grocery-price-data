name: Build price database

on:
  schedule:
    - cron: '0 2 * * *'      # 02:00 UTC - after the chains publish their nightly full files
  workflow_dispatch:
    inputs:
      chains:
        description: 'Space-separated chain names, or blank for the default list'
        required: false
        default: ''
      limit:
        description: 'Max files per chain (leave blank for all; use e.g. 20 for a smoke test)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-price-db
  cancel-in-progress: false

jobs:
  fetch:
    name: ${{ matrix.chain }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false          # one broken chain must not sink the other 16
      max-parallel: 6
      matrix:
        # NETIV_HASED omitted: upstream site is down (HTTP 500), excluded from
        # ScraperFactory.all_scrapers_name() by the library itself - not a typo.
        chain:
          - RAMI_LEVY
          - SHUFERSAL
          - VICTORY_NEW_SOURCE
          - YOHANANOF
          - OSHER_AD
          - HAZI_HINAM
          - TIV_TAAM
          - YAYNO_BITAN_AND_CARREFOUR
          - MAHSANI_ASHUK_NEW_SOURCE
          - KING_STORE
          - STOP_MARKET
          - ZOL_VEBEGADOL
          - KESHET
          - DOR_ALON
          - FRESH_MARKET_AND_SUPER_DOSH
          - SUPER_PHARM
          - YELLOW
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scraper and parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Scrape and parse
        run: |
          python scripts/fetch.py "${{ matrix.chain }}" \
            --timeout 2400 \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Build chain database
        run: python scripts/build_chain_db.py --chain "${{ matrix.chain }}"

      - uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.chain }}
          path: chain_dbs/*.db
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: fetch
    if: always()               # publish whatever chains succeeded; verify.py is the gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          pattern: db-*
          merge-multiple: true
          path: chain_dbs

      - name: Show what arrived
        run: ls -lh chain_dbs/

      - name: Merge, shard, verify
        run: |
          python scripts/merge_db.py --in-dir chain_dbs --out dist/prices.db
          python scripts/build_catalog.py --db dist/prices.db --out-dir dist/catalog
          python scripts/verify.py --db dist/prices.db

      - name: Vendor the SQLite-over-HTTP client
        run: |
          # Bundled into the site rather than loaded from a CDN: browsers refuse
          # to construct a Worker from a cross-origin script.
          npm install --no-save sql.js-httpvfs@0.8.12
          mkdir -p dist/vendor
          cp node_modules/sql.js-httpvfs/dist/index.js \
             node_modules/sql.js-httpvfs/dist/sqlite.worker.js \
             node_modules/sql.js-httpvfs/dist/sql-wasm.wasm \
             dist/vendor/
          cp client/index.html dist/index.html
          ls -lh dist/vendor/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4

      - name: Attach the database to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest price database
          body: |
            Rebuilt automatically. See metadata.json for row counts and build time.
          files: |
            dist/prices.db
            dist/metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
