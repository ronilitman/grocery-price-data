name: Build price database

on:
  schedule:
    - cron: '0 2 * * *'      # 02:00 UTC - after the chains publish their nightly full files
  workflow_dispatch:
    inputs:
      chains:
        description: 'Space-separated chain names, or blank for the default list'
        required: false
        default: ''
      limit:
        description: 'Max files per chain (leave blank for all; use e.g. 20 for a smoke test)'
        required: false
        default: ''
      reuse_run_id:
        description: 'Run ID to reuse chain databases from, skipping scraping entirely (publish-only rebuild, e.g. after a client-only change)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read      # to download artifacts from a previous run (reuse_run_id)

concurrency:
  group: build-price-db
  cancel-in-progress: false

jobs:
  fetch:
    name: ${{ matrix.chain }}
    if: ${{ github.event.inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false          # one broken chain must not sink the other 16
      max-parallel: 6
      matrix:
        # NETIV_HASED omitted: upstream site is down (HTTP 500), excluded from
        # ScraperFactory.all_scrapers_name() by the library itself - not a typo.
        chain:
          - RAMI_LEVY
          - SHUFERSAL
          - VICTORY_NEW_SOURCE
          - YOHANANOF
          - OSHER_AD
          - HAZI_HINAM
          - TIV_TAAM
          - YAYNO_BITAN_AND_CARREFOUR
          - MAHSANI_ASHUK_NEW_SOURCE
          - KING_STORE
          - STOP_MARKET
          - ZOL_VEBEGADOL
          - KESHET
          - DOR_ALON
          - FRESH_MARKET_AND_SUPER_DOSH
          - SUPER_PHARM
          - YELLOW
    env:
      # These four refuse datacenter addresses outright - Reblaze answers 247,
      # Cloudflare answers 403, and laibcatalog just never answers. Nothing
      # about the request is wrong; a runner is simply not allowed to ask.
      # Their traffic leaves through a machine at home instead. OSHER_AD is in
      # on suspicion: it downloads price files locally and only store files on
      # a runner, which is the same shape.
      HOME_EGRESS: '["SUPER_PHARM","HAZI_HINAM","VICTORY_NEW_SOURCE","MAHSANI_ASHUK_NEW_SOURCE","OSHER_AD"]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scraper and parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      # Placed after pip on purpose: package downloads should not travel
      # through a home connection, only the chain's own files.
      - name: Join the tailnet
        if: contains(fromJSON(env.HOME_EGRESS), matrix.chain)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Leave from home
        if: contains(fromJSON(env.HOME_EGRESS), matrix.chain)
        # TS_EXIT_NODE is a repository *variable*, not a secret - point it at
        # whichever machine is currently acting as the exit node and nothing
        # here needs editing.
        run: |
          sudo tailscale set --exit-node='${{ vars.TS_EXIT_NODE }}'
          echo "egress now: $(curl -s --max-time 20 https://ipinfo.io/org)"

      - name: Scrape and parse
        run: |
          python scripts/fetch.py "${{ matrix.chain }}" \
            --timeout 2400 \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      # Back to the runner's own connection before the artifact upload, so a
      # home line carries the chain's files and nothing else. always(), because
      # a failed scrape should not leave the route pinned either.
      - name: Stop leaving from home
        if: always() && contains(fromJSON(env.HOME_EGRESS), matrix.chain)
        run: sudo tailscale set --exit-node=

      - name: Build chain database
        run: python scripts/build_chain_db.py --chain "${{ matrix.chain }}"

      - uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.chain }}
          # 7 days, not 1: reuse_run_id republishes from a prior run's
          # artifacts, and a one-day window makes that unusable by Tuesday.
          path: chain_dbs/*.db
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: fetch
    if: always()               # publish whatever chains succeeded; verify.py is the gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          pattern: db-*
          merge-multiple: true
          path: chain_dbs
          # Defaults to this run's own artifacts; reuse_run_id points it at an
          # older run's instead, so a client-only change can redeploy without
          # rescraping every chain.
          run-id: ${{ github.event.inputs.reuse_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what arrived
        run: ls -lh chain_dbs/

      # A chain that failed tonight still has yesterday's artifact. Rebuilding
      # without it would delete that chain from the site - which is what a
      # sleeping exit node did on 26 Aug, taking five chains down with it.
      - name: Carry forward any chain that failed tonight
        run: python scripts/backfill_chains.py --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge, shard, verify
        run: |
          python scripts/merge_db.py --in-dir chain_dbs --out dist/prices.db
          python scripts/build_catalog.py --db dist/prices.db --out-dir dist/catalog
          python scripts/verify.py --db dist/prices.db

      - name: Assemble the site
        run: |
          # The page reads the JSON shards directly - no SQLite, no WASM, and
          # no 407 MB download. prices.db stays on the Release for anyone who
          # wants to run arbitrary SQL against it.
          cp client/index.html dist/index.html
          # prices.db is built and verified but no longer published: it has
          # outgrown GitHub's 2 GB release-asset limit, and the site reads the
          # JSON shards regardless. Nothing consumed the release copy.
          rm -f dist/prices.db
          du -sh dist dist/catalog
          ls -1 dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4

