name: Retry failed chains

# The retry loop inside build.yml handles a chain that misbehaves. It cannot
# handle the runner disappearing underneath it: GitHub reclaims a hosted runner
# by sending SIGTERM, the job dies with exit 143, and everything in that shell
# - loop included - dies with it. Super-Pharm went that way on 6 Sept, eleven
# minutes into a scrape that had nothing wrong with it, and the site served the
# previous evening's promotions all day as a result.
#
# So this re-runs the failed jobs on fresh runners. `--failed` re-runs only
# those, not the whole matrix, and because publish is `needs: fetch` with
# `if: always()` it re-runs too - which is the point, since a recovered chain
# is no use until the site is rebuilt from it.

on:
  workflow_run:
    workflows: ["Build price database"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    # Once, and only once. run_attempt is 1 for the original run and 2 after
    # this workflow has acted, so the guard is what stops a chain that is
    # genuinely broken from re-running itself all night.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the jobs that failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          failed=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100" \
                     --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          echo "Run $RUN_ID failed these jobs: ${failed:-none}"
          if [ -z "$failed" ]; then
            echo "Nothing failed at job level - not re-running."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "${{ github.repository }}"
          echo "::notice::Re-running failed jobs of run $RUN_ID: $failed"
