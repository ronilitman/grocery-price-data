# Proves the alerting credentials work before any alerting logic exists.
# Manual-only on purpose: it writes a throwaway document and posts a message,
# and neither belongs on a schedule.
name: Alerts self-check

on:
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Firestore client
        run: pip install --quiet google-cloud-firestore

      # The key never touches the repo. It is written to the runner's
      # temp directory, which is destroyed with the runner.
      - name: Materialise the service-account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY is not set on this repository"
            exit 1
          fi
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          python -c "import json,os;json.load(open(os.environ['RUNNER_TEMP']+'/sa.json'))" \
            || { echo "::error::GCP_SA_KEY is not valid JSON"; exit 1; }

      - name: Check Firestore and Telegram
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/alerts_selfcheck.py

      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
