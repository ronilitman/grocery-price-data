<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מחירי סופרמרקטים</title>
<style>
  :root{--bg:#f6f7f4;--fg:#151a17;--muted:#5d6a64;--rule:#d9e0da;--card:#fff;--accent:#0e6e5c}
  @media (prefers-color-scheme:dark){
    :root{--bg:#101312;--fg:#e6ece8;--muted:#9aa7a1;--rule:#282f2c;--card:#171b19;--accent:#4cc5a8}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 18px 64px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  fieldset{border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:14px;margin:0 0 14px}
  legend{font-size:13px;color:var(--accent);padding:0 6px;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;
    background:var(--bg);color:var(--fg)}
  input{flex:1;min-width:150px;font-variant-numeric:tabular-nums}
  button{background:var(--accent);color:#fff;border-color:transparent;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  h2{font-size:17px;margin:18px 0 2px}
  .bc{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--rule)}
  th{font-size:12px;color:var(--muted);font-weight:600}
  td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.best td{font-weight:700;color:var(--accent)}
  #status{font-size:13px;color:var(--muted);margin-top:14px;white-space:pre-wrap}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<main>
  <h1>מחירי סופרמרקטים</h1>
  <p class="sub">חיפוש לפי ברקוד. קבצים סטטיים בלבד — אין שרת ואין מסד נתונים בדפדפן.</p>

  <fieldset>
    <legend>חיפוש לפי ברקוד</legend>
    <div class="row">
      <input id="bc" placeholder="7290004127329" inputmode="numeric" autocomplete="off">
      <button id="go">בדוק</button>
    </div>
  </fieldset>

  <div id="result"></div>
  <div id="status">טוען…</div>
</main>

<script type="module">
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const input = document.getElementById("bc");
const button = document.getElementById("go");

const base = new URL("./catalog/", location.href);
let index = null;               // {levels, shards:[...], chains:{id:name}}
const shardCache = new Map();   // prefix -> parsed shard

// Longest prefix in the index that this barcode falls under. The build splits
// crowded buckets deeper (729 is Israel's GS1 prefix, so nearly everything
// starts with it), and index.json records which prefixes went deep.
function shardFor(barcode) {
  let best = null;
  for (const depth of index.levels) {
    const prefix = barcode.slice(0, depth).padEnd(depth, "0");
    if (index.shards.includes(prefix)) best = prefix;
  }
  return best;
}

async function loadShard(prefix) {
  if (!shardCache.has(prefix)) {
    const res = await fetch(new URL(`${prefix}.json`, base));
    if (!res.ok) throw new Error(`shard ${prefix}: ${res.status}`);
    shardCache.set(prefix, await res.json());
  }
  return shardCache.get(prefix);
}

function render(barcode, entry) {
  const rows = Object.entries(entry.p).sort((a, b) => a[1] - b[1]);
  if (!rows.length) {
    resultEl.innerHTML = `<h2>${entry.n}</h2><p class="bc">${barcode}</p>
      <p class="sub">אין מחירים למוצר הזה.</p>`;
    return;
  }
  const cheapest = rows[0][1];
  resultEl.innerHTML =
    `<h2>${entry.n}</h2><p class="bc">ברקוד ${barcode}</p>` +
    `<div class="scroll"><table><tr><th>רשת</th><th>מחיר</th><th>הפרש</th></tr>` +
    rows.map(([id, price]) => {
      const diff = price - cheapest;
      return `<tr class="${diff === 0 ? "best" : ""}">` +
             `<td>${index.chains[id] ?? id}</td>` +
             `<td class="n">${price.toFixed(2)}</td>` +
             `<td class="n">${diff === 0 ? "—" : "+" + diff.toFixed(2)}</td></tr>`;
    }).join("") +
    `</table></div>`;
}

async function search() {
  const barcode = input.value.replace(/\D/g, "");
  if (!barcode) return;
  history.replaceState(null, "", `?bc=${barcode}`);
  resultEl.innerHTML = "";
  statusEl.textContent = "מחפש…";
  const started = performance.now();
  try {
    const prefix = shardFor(barcode);
    if (!prefix) { statusEl.textContent = "ברקוד לא נמצא."; return; }
    const shard = await loadShard(prefix);
    const entry = shard[barcode];
    if (!entry) { statusEl.textContent = "ברקוד לא נמצא."; return; }
    render(barcode, entry);
    const n = Object.keys(entry.p).length;
    statusEl.textContent =
      `${n === 1 ? "רשת אחת" : n + " רשתות"} · ${Math.round(performance.now() - started)}ms`;
  } catch (err) {
    statusEl.textContent = "שגיאה: " + err.message;
  }
}

button.onclick = search;
input.onkeydown = e => { if (e.key === "Enter") search(); };

(async () => {
  index = await (await fetch(new URL("index.json", base))).json();
  statusEl.textContent =
    `${index.products.toLocaleString()} מוצרים · ${Object.keys(index.chains).length} רשתות` +
    (index.built_at ? ` · עודכן ${index.built_at.slice(0, 10)}` : "");
  const fromUrl = new URLSearchParams(location.search).get("bc");
  if (fromUrl) { input.value = fromUrl; search(); }
})().catch(err => { statusEl.textContent = "שגיאה בטעינה: " + err.message; });
</script>
</body>
</html>
